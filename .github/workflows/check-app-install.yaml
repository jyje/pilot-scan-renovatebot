name: 🔑 check app install

# Read-only check using the same repository-scoped App token as Renovate.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: Iv23liPUAdp1yJeUO57X # jyje-bot
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: jyje
          repositories: cluster

      - name: Show what the token can reach
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/jyje/cluster --jq '"installed and reachable: \(.full_name) (default branch \(.default_branch))"'

      - name: Check Dependabot alerts access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api --silent 'repos/jyje/cluster/dependabot/alerts?per_page=1'
          echo 'Dependabot alerts API is accessible to jyje-bot.'
