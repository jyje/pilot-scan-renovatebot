name: 🤖 renovate

# Central self-hosted Renovate: one workflow, one secret, three repositories plus this one
# (so Renovate also keeps its own action pins and image version current).
#
# The jyje-bot GitHub App is installed on the target repos. This workflow signs in as the App
# with its private key (stored once, in this repo) and asks for a token limited to those repos.
# Each repo only needs its own renovate.json5; a repo without one is skipped
# (RENOVATE_REQUIRE_CONFIG=required), so a repo joins the run when its config PR is merged.
#
# Needed here: secret APP_PRIVATE_KEY (PEM). The client id is not a secret.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "full: log only. off: create branches and PRs"
        type: choice
        options: ["full", "lookup", "off"]
        default: "full"
  schedule:
    # Sundays 16:00 UTC = Monday 01:00 KST. Scheduled runs can start hours late (one started 3.5 h late), and
    # the configs only open PRs "before 6am on monday" (KST), so start early enough to stay inside that window.
    - cron: "0 16 * * 0"

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Directory the container can write its log to
        run: install -d -m 777 /tmp/renovate-out

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: Iv23liPUAdp1yJeUO57X # jyje-bot, same value as claude-docker's APP_CLIENT_ID
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: jyje
          repositories: |
            cluster
            pifanctl
            mungchilog
            pilot-scan-renovatebot

      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.149.2
          additional-env-list: |
            LOG_FILE
            LOG_FILE_LEVEL
          docker-volumes: |
            /tmp/renovate-out:/renovate-out
        env:
          RENOVATE_REPOSITORIES: jyje/cluster,jyje/pifanctl,jyje/mungchilog,jyje/pilot-scan-renovatebot
          # Scheduled runs create PRs; manual runs default to a dry run.
          RENOVATE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run != 'off' && inputs.dry-run || '' }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: debug
          LOG_FILE: /renovate-out/renovate-log.jsonl
          LOG_FILE_LEVEL: debug

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Renovate run (dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'off' }})"
            echo
            for r in cluster pifanctl mungchilog pilot-scan-renovatebot; do
              echo "- jyje/$r: $(jq -r --arg r "jyje/$r" 'select(.repository==$r and (.msg|test("^branchExists="))) | .branch' /tmp/renovate-out/renovate-log.jsonl 2>/dev/null | sort -u | wc -l) branches considered"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: renovate-log
          path: /tmp/renovate-out/renovate-log.jsonl
          retention-days: 7
